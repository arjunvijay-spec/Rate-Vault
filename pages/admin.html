<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - RateVault</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding: 2rem; }
        .admin-panel { max-width: 1200px; margin: 0 auto; }
        h1 { margin-bottom: 2rem; color: #FFD700; }
        .users-table { width: 100%; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        th { background: rgba(255, 215, 0, 0.1); color: #FFD700; font-weight: 600; }
        .badge { padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .badge-admin { background: rgba(255, 215, 0, 0.2); color: #FFD700; }
        .badge-user { background: rgba(0, 200, 83, 0.2); color: #00C853; }
        .badge-active { background: rgba(0, 200, 83, 0.2); color: #00C853; }
        .badge-blocked { background: rgba(239, 68, 68, 0.2); color: #EF4444; }
    </style>
</head>
<body class="loaded">
    <div class="admin-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1><i class="fas fa-shield-alt"></i> Admin Panel</h1>
            <div>
                <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'" style="margin-right: 1rem;">
                    <i class="fas fa-th-large"></i> Dashboard
                </button>
                <button class="btn btn-secondary" onclick="if(confirm('Are you sure you want to logout?')) Session.logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
        
        <div class="users-table">
            <h2 style="padding: 1.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">User Management</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTable"></tbody>
            </table>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/utils.js"></script>
    <script>
        if (!Session.isAuthenticated() || !Session.isAdmin()) {
            window.location.href = '../index.html';
        }
        
        function loadUsers() {
            const users = Storage.get('rv_users') || [];
            const tbody = document.getElementById('usersTable');
            
            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td><span class="badge badge-${user.role}">${user.role}</span></td>
                    <td><span class="badge badge-${user.status}">${user.status}</span></td>
                    <td>${new Date(user.createdAt).toLocaleDateString()}</td>
                    <td>
                        ${user.role !== 'admin' ? `
                            <button onclick="toggleUserStatus('${user.id}', '${user.status}')" 
                                    class="btn ${user.status === 'active' ? 'btn-secondary' : 'btn-primary'}"
                                    style="padding: 0.5rem 1rem; font-size: 0.875rem;">
                                ${user.status === 'active' ? 'Block' : 'Unblock'}
                            </button>
                        ` : '<span style="color: #CBD5E0;">-</span>'}
                    </td>
                </tr>
            `).join('');
        }
        
        function toggleUserStatus(userId, currentStatus) {
            const users = Storage.get('rv_users') || [];
            const user = users.find(u => u.id === userId);
            
            if (user) {
                user.status = currentStatus === 'active' ? 'blocked' : 'active';
                Storage.set('rv_users', users);
                loadUsers();
                Toast.show(`User ${user.status === 'blocked' ? 'blocked' : 'unblocked'} successfully`, 'success');
            }
        }
        
        loadUsers();
    </script>
</body>
</html>
