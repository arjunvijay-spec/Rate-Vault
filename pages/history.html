<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversion History - RateVault</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding: 0; margin: 0; display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #1A1F35; padding: 2rem 0; position: fixed; height: 100vh; overflow-y: auto; }
        .logo { padding: 0 2rem 2rem; font-size: 1.5rem; font-weight: 700; color: #00C853; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .nav-item { padding: 0.875rem 2rem; display: flex; align-items: center; gap: 1rem; color: #CBD5E0; text-decoration: none; transition: all 0.3s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background: rgba(0, 200, 83, 0.1); color: #00C853; border-left: 3px solid #00C853; }
        .main-content { margin-left: 260px; flex: 1; padding: 2rem; background: #0A0E1A; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .search-bar { padding: 0.75rem 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: white; width: 300px; }
        .history-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); padding: 1.5rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s; }
        .history-card:hover { border-color: rgba(0, 200, 83, 0.3); transform: translateX(5px); }
        .history-info { flex: 1; }
        .history-amount { font-size: 1.25rem; font-weight: 700; color: #00C853; margin-bottom: 0.25rem; }
        .history-rate { color: #CBD5E0; font-size: 0.875rem; }
        .history-date { color: #CBD5E0; font-size: 0.75rem; margin-top: 0.5rem; }
        .history-actions { display: flex; gap: 0.5rem; }
        .empty-state { text-align: center; padding: 4rem 2rem; color: #CBD5E0; }
        .empty-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.3; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); padding: 1.5rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 700; color: #00C853; }
        .stat-label { color: #CBD5E0; font-size: 0.875rem; margin-top: 0.5rem; }
        @media (max-width: 768px) {
            .sidebar { width: 0; transform: translateX(-100%); }
            .main-content { margin-left: 0; }
            .search-bar { width: 100%; }
        }
    </style>
</head>
<body class="loaded">
    <div class="sidebar">
        <div class="logo" onclick="window.location.href='dashboard.html'">
            <i class="fas fa-vault"></i>
            RateVault
        </div>
        <nav>
            <a class="nav-item" onclick="window.location.href='dashboard.html'">
                <i class="fas fa-th-large"></i>
                <span>Dashboard</span>
            </a>
            <a class="nav-item" onclick="window.location.href='converter.html'">
                <i class="fas fa-exchange-alt"></i>
                <span>Converter</span>
            </a>
            <a class="nav-item" onclick="window.location.href='analytics.html'">
                <i class="fas fa-chart-line"></i>
                <span>Analytics</span>
            </a>
            <a class="nav-item active">
                <i class="fas fa-history"></i>
                <span>History</span>
            </a>
        </nav>
        <div style="position: absolute; bottom: 2rem; width: 100%; padding: 0 2rem;">
            <button class="btn btn-secondary" onclick="handleLogout()" style="width: 100%;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <h1>Conversion History</h1>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <input type="text" class="search-bar" id="searchBar" placeholder="Search conversions..." oninput="filterHistory()">
                <button class="btn btn-primary" onclick="clearAllHistory()">
                    <i class="fas fa-trash"></i> Clear All
                </button>
            </div>
        </div>
        
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Total Conversions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="todayCount">0</div>
                <div class="stat-label">Today</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="thisWeek">0</div>
                <div class="stat-label">This Week</div>
            </div>
        </div>

        <div id="historyList"></div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script>
        if (!Session.isAuthenticated()) {
            window.location.href = '../index.html';
        }
        
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                Session.logout();
            }
        }
        
        let allHistory = [];
        
        function loadHistory() {
            allHistory = conversionHistory.getUserHistory();
            displayHistory(allHistory);
            updateStats();
        }
        
        function displayHistory(history) {
            const container = document.getElementById('historyList');
            
            if (history.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-history"></i></div>
                        <h3>No conversion history</h3>
                        <p>Start converting currencies to see your history here</p>
                        <button class="btn btn-primary" onclick="window.location.href='converter.html'" style="margin-top: 1rem;">
                            <i class="fas fa-plus"></i> New Conversion
                        </button>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = history.map(h => `
                <div class="history-card">
                    <div class="history-info">
                        <div class="history-amount">
                            ${h.amount.toFixed(2)} ${h.from} → ${h.result.toFixed(2)} ${h.to}
                        </div>
                        <div class="history-rate">
                            Rate: 1 ${h.from} = ${h.rate.toFixed(4)} ${h.to}
                        </div>
                        <div class="history-date">
                            <i class="fas fa-clock"></i> ${new Date(h.timestamp).toLocaleString()}
                        </div>
                    </div>
                    <div class="history-actions">
                        <button class="btn btn-secondary" onclick="repeatConversion('${h.from}', '${h.to}', ${h.amount})" style="padding: 0.5rem 1rem;">
                            <i class="fas fa-redo"></i> Repeat
                        </button>
                        <button class="btn btn-secondary" onclick="deleteHistory('${h.id}')" style="padding: 0.5rem 1rem; background: rgba(239, 68, 68, 0.2); color: #EF4444;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function filterHistory() {
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();
            const filtered = allHistory.filter(h => 
                h.from.toLowerCase().includes(searchTerm) ||
                h.to.toLowerCase().includes(searchTerm) ||
                h.amount.toString().includes(searchTerm)
            );
            displayHistory(filtered);
        }
        
        function updateStats() {
            const stats = conversionHistory.getStats();
            document.getElementById('totalCount').textContent = stats.total;
            document.getElementById('todayCount').textContent = stats.today;
            document.getElementById('thisWeek').textContent = stats.thisWeek;
        }
        
        function deleteHistory(id) {
            if (confirm('Delete this conversion?')) {
                conversionHistory.delete(id);
                loadHistory();
                Toast.show('Conversion deleted', 'success');
            }
        }
        
        function clearAllHistory() {
            if (confirm('Delete all conversion history? This cannot be undone.')) {
                conversionHistory.clear();
                loadHistory();
                Toast.show('History cleared', 'success');
            }
        }
        
        function repeatConversion(from, to, amount) {
            localStorage.setItem('repeatConversion', JSON.stringify({ from, to, amount }));
            window.location.href = 'converter.html';
        }
        
        loadHistory();
    </script>
</body>
</html>
