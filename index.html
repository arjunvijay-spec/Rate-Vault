<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RateVault - Smart Currency Converter</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="loaded">
    <div class="auth-container">
        <div class="background-animation">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="gradient-orb orb-3"></div>
        </div>

        <!-- User Login Card -->
        <div class="auth-card glass-card" id="loginCard">
            <div class="card-header">
                <div class="logo-container">
                    <div class="logo-icon">
                        <i class="fas fa-vault"></i>
                    </div>
                    <h1 class="app-title">RateVault</h1>
                </div>
                <p class="subtitle">Real-time Currency Conversion Platform</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group floating-label">
                    <input type="email" id="loginEmail" required autocomplete="email" placeholder=" ">
                    <label for="loginEmail">Email Address</label>
                    <i class="fas fa-envelope input-icon"></i>
                </div>

                <div class="form-group floating-label">
                    <input type="password" id="loginPassword" required autocomplete="current-password" placeholder=" ">
                    <label for="loginPassword">Password</label>
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <button type="submit" class="btn btn-primary btn-glow">
                    <span class="btn-text">Sign In</span>
                    <i class="fas fa-arrow-right btn-icon"></i>
                </button>

                <div class="divider"><span>or</span></div>

                <p class="switch-auth">
                    Don't have an account? 
                    <a href="#" onclick="showRegister(); return false;">Create Account</a>
                </p>
                
                <p class="switch-auth">
                    <a href="#" onclick="showAdminLogin(); return false;" style="color: var(--gold);">
                        <i class="fas fa-shield-alt"></i> Admin Login
                    </a>
                </p>
            </form>
        </div>

        <!-- Admin Login Card -->
        <div class="auth-card glass-card hidden" id="adminLoginCard">
            <div class="card-header">
                <div class="logo-container">
                    <div class="logo-icon gold-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <h1 class="app-title gold-title">Admin Access</h1>
                </div>
                <p class="subtitle">Administrative Portal</p>
            </div>

            <form id="adminLoginForm" class="auth-form">
                <div class="form-group floating-label">
                    <input type="email" id="adminEmail" required autocomplete="email" placeholder=" ">
                    <label for="adminEmail">Admin Email</label>
                    <i class="fas fa-user-shield input-icon"></i>
                </div>

                <div class="form-group floating-label">
                    <input type="password" id="adminPassword" required autocomplete="current-password" placeholder=" ">
                    <label for="adminPassword">Admin Password</label>
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="password-toggle" onclick="togglePassword('adminPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <button type="submit" class="btn btn-gold btn-glow">
                    <span class="btn-text">Admin Sign In</span>
                    <i class="fas fa-arrow-right btn-icon"></i>
                </button>

                <div class="divider"><span>or</span></div>

                <p class="switch-auth">
                    <a href="#" onclick="showLogin(); return false;">
                        <i class="fas fa-arrow-left"></i> Back to User Login
                    </a>
                </p>
            </form>
        </div>

        <!-- Register Card -->
        <div class="auth-card glass-card hidden" id="registerCard">
            <div class="card-header">
                <div class="logo-container">
                    <div class="logo-icon">
                        <i class="fas fa-vault"></i>
                    </div>
                    <h1 class="app-title">Create Account</h1>
                </div>
                <p class="subtitle">Join RateVault Today</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group floating-label">
                    <input type="text" id="registerName" required autocomplete="name" placeholder=" ">
                    <label for="registerName">Full Name</label>
                    <i class="fas fa-user input-icon"></i>
                </div>

                <div class="form-group floating-label">
                    <input type="email" id="registerEmail" required autocomplete="email" placeholder=" ">
                    <label for="registerEmail">Email Address</label>
                    <i class="fas fa-envelope input-icon"></i>
                </div>

                <div class="form-group floating-label">
                    <input type="password" id="registerPassword" required autocomplete="new-password" placeholder=" ">
                    <label for="registerPassword">Password</label>
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="password-toggle" onclick="togglePassword('registerPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="form-group floating-label">
                    <input type="password" id="registerConfirmPassword" required autocomplete="new-password" placeholder=" ">
                    <label for="registerConfirmPassword">Confirm Password</label>
                    <i class="fas fa-lock input-icon"></i>
                </div>

                <div class="password-strength" id="passwordStrength" style="display: none;">
                    <div class="strength-bar">
                        <div class="strength-fill"></div>
                    </div>
                    <p class="strength-text">Password Strength: <span></span></p>
                </div>

                <button type="submit" class="btn btn-primary btn-glow">
                    <span class="btn-text">Create Account</span>
                    <i class="fas fa-user-plus btn-icon"></i>
                </button>

                <div class="divider"><span>or</span></div>

                <p class="switch-auth">
                    Already have an account? 
                    <a href="#" onclick="showLogin(); return false;">Sign In</a>
                </p>
            </form>
        </div>

        <!-- Success Animation -->
        <div class="success-animation hidden" id="successAnimation">
            <div class="success-checkmark">
                <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                    <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <h2 class="success-title">Welcome!</h2>
            <p class="success-message">Redirecting...</p>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
